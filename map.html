<!DOCTYPE html>
<html>
<head>
  <title>Ejemplo de Google Maps - Christian Naranjo</title>
  <style>
    #map {
      height: 400px;
      width: 100%;
    }
  </style>
</head>
<body>
  <h3>Mi primer mapa con Google Maps API</h3>
  <h1>El Panecillo</h1>
  <p>Sitio turístico de Quito, Ecuador</p>
  <p>Christian Naranjo</p>
  <iframe
    width="600"
    height="450"
    style="border:0"
    loading="lazy"
    allowfullscreen
    referrerpolicy="strict-origin-when-cross-origin"
    src="https://www.google.com/maps/embed/v1/place?key=AIzaSyAj0sVroM5li8WlQzZ4BAw-sb5ufMqC3PA&q=El+Panecillo,Quito,Ecuador">
  </iframe>
  <iframe
    width="600"
    height="450"
    style="border:0"
    loading="lazy"
    allowfullscreen
    src="https://www.google.com/maps/embed/v1/streetview?key=AIzaSyAj0sVroM5li8WlQzZ4BAw-sb5ufMqC3PA&pano=Q5azSGQG1kNgBd03WDYIpw&heading=184.21&pitch=-5.92&fov=90">
  </iframe>
</body>
</html>
